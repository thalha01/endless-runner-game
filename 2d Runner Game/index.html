<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 2D Endless Runner Game</title>
    <style>
        body {
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #ffffff;
            border-radius: 8px;
            background-color: #70c5ce;
            display: block;
            margin: 20px auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .instructions {
            font-size: 14px;
            color: #ccc;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>Super Endless Runner</h1>
    <p class="instructions">Press <b>Space / Up Arrow / Click</b> to Jump (Double Jump Enabled!)</p>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script src="game.js"></script>
</body>
</html>
